name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # Build every asset on one runner instead of requiring five hosted runners.
    runs-on: ubuntu-24.04
    steps:
      # fetch-depth 0 so the annotated tag object is present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      # Keep the asset names used by pier update. Pure Go reaches android/arm64
      # without the NDK; android/amd64 and android/386 need external linking.
      - name: build release assets
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERSION#v}" ] || [ "$VERSION" = "main" ]; then VERSION="${GITHUB_SHA::7}"; fi
          mkdir -p dist
          for target in android/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            asset="pier-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then asset="${asset}.exe"; fi
            echo "::group::$target"
            go build -trimpath -ldflags "-s -w -X github.com/dat267/pier/coding.Version=$VERSION" \
              -o "dist/$asset" .
            file "dist/$asset"
            (cd dist && sha256sum "$asset" > "$asset.sha256")
            echo "::endgroup::"
          done

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pier-release
          path: dist/*

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          # Publish the annotated tag's message as the release body. Best-effort,
          # because a lightweight tag has no annotation to fetch.
          sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha' 2>/dev/null || true)"
          notes="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.message' 2>/dev/null || true)"
          if [ -n "$notes" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" || true
          fi
