name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Every goroutine stack on a hang or crash, including the deliberate
  # deadlock helper used to test the SIGQUIT stack parser.
  GOTRACEBACK: all

jobs:
  test:
    # Keep all gates on one runner. Matrix fan-out previously required seven
    # hosted runners; acquisition failures cancelled jobs before they started.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go mod tidy
        run: go mod tidy -diff

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: extractions/setup-just@v2

      - name: reference
        # ./pi is gitignored; the golden generators import its packages, which
        # need their dependencies and a build before they can run.
        run: |
          just fetch-reference
          cd pi
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: goldens
        # Every fixture regenerates byte for byte from the pinned ./pi, so a diff
        # here means the port drifted from the reference.
        run: just goldens

      - name: build pier (used by the real-binary PTY tests)
        run: go build -o pier .

      - name: test
        env:
          PIER_TEST_BIN: ${{ github.workspace }}/pier
        # Run every test twice under the race detector. The timeout is a hang
        # guard, not a performance budget; measure suite duration separately.
        run: go test -race -count=2 -timeout 300s ./...

      # The packages with the most shared state again, shuffled, on one CPU and
      # on four: GOMAXPROCS=1 starves goroutines the way a busy machine does,
      # and shuffling catches a test that depends on another's leftovers.
      - name: race stress
        env:
          PIER_TEST_BIN: ${{ github.workspace }}/pier
        run: go test -race -count=2 -cpu=1,4 -shuffle=on -timeout 900s ./agent ./coding ./coding/interactive ./mcp

      # Each test alone in a fresh process, twice: shuffling rarely runs a
      # test first, so it misses one that relies on an earlier test's global
      # state, and a second run catches one that leaves state behind.
      - name: isolated tests
        run: COUNT=2 scripts/test_isolated.sh

      # vet also compiles every _test.go, catching platform-specific syscall
      # use. Keep every former matrix target, without acquiring more runners.
      - name: cross-build and vet
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 linux/arm64 android/arm64 darwin/arm64 darwin/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "::group::$target"
            go build ./...
            go vet ./...
            echo "::endgroup::"
          done
