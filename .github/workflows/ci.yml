name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Every goroutine stack on a hang or crash (the PTY watchdogs parse the
  # SIGQUIT dump for mutex-blocked goroutines).
  GOTRACEBACK: all

jobs:
  test:
    # Keep all gates on one runner. Matrix fan-out previously required seven
    # hosted runners; acquisition failures cancelled jobs before they started.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: build pier (used by the PTY watchdogs)
        run: go build -o pier .

      - name: test
        env:
          PIER_TEST_BIN: ${{ github.workspace }}/pier
        # -race -count=2 doubles the work; the timeout is a hang guard, not a
        # budget. At 60s the suite sat at ~55s (ai) and ~35s
        # (coding/interactive), so any added test tripped it.
        run: go test -race -count=2 -timeout 300s ./...

      # vet also compiles every _test.go, catching platform-specific syscall
      # use. Keep every former matrix target, without acquiring more runners.
      - name: cross-build and vet
        env:
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          for target in windows/amd64 windows/arm64 linux/arm64 android/arm64 darwin/arm64 darwin/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            echo "::group::$target"
            go build ./...
            go vet ./...
            echo "::endgroup::"
          done
